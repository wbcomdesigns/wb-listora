  ready_when: |
    All blocking smoke failures (F-04, F-05) re-verified GREEN in next smoke
    re-run AND the 3 still-open Bugs-column cards (9895633882 Subscriber tabs,
    9895518880 List/Grid toggle, 9857011539 Admin add-listing 404) either
