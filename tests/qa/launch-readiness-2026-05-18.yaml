    not advisories. See `ux_consistency_review` section.
  late_evening_correction_2026_05_12:   # historical context
    - "User flagged PHP 8 deprecation noise (strpos/str_replace null) appearing on every admin request."
    - "I'd dismissed it earlier as 'WP-core / 3rd party, not our codebase'. WRONG."
    - "Stack trace via temp mu-plugin pinned the trigger on OUR add_submenu_page() calls passing null as parent_slug to hide submenus from sidebar. WP internally calls plugin_basename(null) → wp_normalize_path(null) → wp_is_stream(null) → strpos(null, '://')."
    - "Fixed in 2 sites: Free class-admin.php (05eff4d) + Pro class-setup-wizard.php (5ae21ed). null → '' (empty string is canonical hidden-submenu pattern). Page slugs remain accessible by direct URL."
    - "Live-verified: 3 admin pages hit (wp-admin, listora-settings, listora-tools), debug.log clean across all."
