  policy_anchors:
    - "Every backend gate has a matching UI affordance OR a clearly-communicated rejection message. Silent failures are out."
    - "Same payload shape across endpoints serving the same logical resource. Drift = bug."
    - "Two URL conventions for the same intent → support both unless one is being deprecated."
    - "Affordances must imply behavior. If a button can't do its job in some state, hide it."
    - "Anonymous visitors always have a clear path forward — no dead-end modals."
    - "Feature-toggle state is mirrored in both backend gates AND frontend affordances. Disable one without the other = broken UX."

