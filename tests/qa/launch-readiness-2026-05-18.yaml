    note: |
      All 4 are admin-context; none are customer-facing. None of the 4 has a
      direct equivalent in a customer journey. The Part 6 max-2 guideline
      remains valid for customer-facing surfaces (Free has ZERO customer-facing
      AJAX — all customer interactions are REST + Interactivity API).

