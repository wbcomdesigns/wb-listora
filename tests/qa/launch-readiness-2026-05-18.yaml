# ─── UX CONSISTENCY REVIEW (per user directive 2026-05-18) ───
# Every functional gate must be mirrored in the UI affordance and vice-versa.
# Uniform backend↔frontend journey is the bar; cosmetic UX issues are NOT
# downgraded to advisories.
ux_consistency_review:
  resolved_2026_05_18:
    - id: UX-CONS-1
      surface: reviews_feature_toggle
      gap: |
        Reviews toggle disabled → backend was silently accepting POST
        /reviews requests + storing reviews (no gate). Frontend kept showing
        the Write a Review button. User filled the form, hit submit, got a
        silent 403 with no on-screen explanation.
      resolution: |
        41c4a68 — create_review_permissions() now checks
        wb_listora_get_setting('enable_reviews', true) BEFORE the login check
        and returns translatable 'listora_reviews_disabled' error. AND the
        "Write a Review" button + form are hidden from the detail-page tabs
        entirely. Backend gate ↔ frontend affordance now match.
      principle: "Backend and frontend must agree on feature toggle state."

    - id: UX-CONS-2
      surface: anon_login_modal
      gap: |
        Save-to-Favorites / Claim-Business on a listing as anonymous → no
        modal rendered (store dispatched activeModal='login' but no DOM
        element existed). Even after the markup landed in 772316b, the
        Create Account CTA was gated on users_can_register=1 — sites with
        registration disabled saw a dead-end modal with only Log In.
      resolution: |
        772316b — login modal markup added, reusing canonical
        .listora-detail__modal family for visual consistency with the claim
        modal. Then 773a89a — Create Account always renders;
        wp_registration_url() resolves to the WP page that already shows
        "Registration currently not allowed" when disabled. New
        wb_listora_login_modal_register_url filter for invite-only sites.
      principle: "Anonymous visitors must always have a clear path forward."

    - id: UX-CONS-3
      surface: listing_status_view_link
      gap: |
        Deactivated/awaiting-credits/pending listings had a View (eye) icon in
        the dashboard that 404'd. The icon was rendered unconditionally — owner
        saw the affordance, clicked it, hit a confusing 404.
      resolution: |
        5a4d0f9 — View icon now only renders when post_status === 'publish'.
        Edit icon stays for all statuses (correct — owners need to edit a
        deactivated listing to fix it before reactivating).
      principle: "If the affordance leads to a dead end, hide the affordance."

    - id: UX-CONS-4
      surface: dashboard_edit_url_param
      gap: |
        Dashboard Edit-link builder used ?action=edit&id=N (REST/admin
        convention). Submission block edit-mode detection only checked
        ?edit=N. Edit-mode detection failed silently → form rendered EMPTY.
        Every user editing every listing was affected.
      resolution: |
        5a4d0f9 — submission block now accepts BOTH URL conventions.
        Standalone /submit-listing/?edit=N continues to work; dashboard's
        /dashboard/?tab=listings&action=edit&id=N path now also pre-fills
        the form.
      principle: "Two URL conventions for the same intent → support both, don't make the user notice."

    - id: UX-CONS-5
      surface: rest_timestamp_pair_consistency
      gap: |
        /listings/{id} initially missing created_at/updated_at while
        /listings/{id}/detail had `date`/`modified` in local timezone (no
        RFC-3339 pair). Headless client building a list view + detail view
        had to handle 4 different shapes across 2 endpoints.
      resolution: |
        41c4a68 — single-listing endpoint gained created_at/updated_at.
        This YAML's commit — /detail endpoint gains the same pair. Both
        endpoints now emit the SAME canonical RFC-3339 pair under the SAME
        keys. Old `date`/`modified` keys stay on /detail for back-compat.
      principle: "Same data → same key names → same shape across endpoints."

    - id: UX-CONS-6
      surface: search_type_dropdown_vs_tile
      gap: |
        Tile-style Type buttons (which set IAPI context dynamically) worked.
        The <select> Type dropdown (which has static empty context) returned
        empty typeSlug regardless of selection. Same logical action, two
        backing patterns, only one wired.
      resolution: |
        41c4a68 — selectType() reads event.target.value as fallback when
        the IAPI context typeSlug is empty. Tiles keep working via the
        existing ctx.typeSlug path; dropdown now works via the fallback.
      principle: "Same action across UI patterns → one action handler, all patterns wired."

    - id: UX-CONS-7
      surface: search_bar_button_overlap
      gap: |
        Location + keyword inputs absolutely-positioned Near Me / Clear button
        at field's right edge. No padding-inline-end → typed text slid under
        the button at narrow viewports.
      resolution: |
        41c4a68 — padding-inline-end: 2.5rem reserves space for the button.
      principle: "Visual overlap = broken affordance, not a cosmetic gripe."

    - id: UX-CONS-8
      surface: service_details_toggle_visibility
      gap: |
        Service description block always rendered a "Details" expand-toggle,
        even for short descriptions that didn't overflow the 2-line collapsed
        view. Clicking did nothing visible — wasted affordance + visual noise.
      resolution: |
        41c4a68 — toggle now only renders when stripped description >120
        chars. Short descriptions render inline without the toggle.
      principle: "Affordance must imply behavior. No no-op buttons."

    - id: UX-CONS-9
      surface: rest_list_endpoint_shape
      gap: |
        /listings returned a bare WP_REST_Posts_Controller array on the OFFSET
        branch (default) but the envelope { listings, total, pages, has_more,
        cursor, next_cursor } on the CURSOR branch. /search returned the
        envelope. Same payload, 3 shapes across one product. Headless / mobile
        clients had to special-case the OFFSET response.
      resolution: |
        D1 — /listings OFFSET branch now wraps the parent response in the
        same envelope. WP-standard pagination headers (X-WP-Total /
        X-WP-TotalPages / X-WP-NextCursor) still emit for WP-native clients.
        /search and /listings now emit the same canonical shape.
      principle: "Same payload across endpoints → same shape. Wrap once, consume the same way."

  open_ux_audits_pending:
    - id: UX-AUDIT-1
      surface: dashboard_subscriber_tabs
      status: pending_repro
      basecamp: 9895633882
      severity: high
