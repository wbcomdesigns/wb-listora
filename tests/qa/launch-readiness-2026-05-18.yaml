    User directive 2026-05-18: backend and frontend journeys must stay uniform
    and consistent — every functional fix must be mirrored in the UI
    affordance, and every UI affordance must be backed by a functional gate.
    UX-only gaps (visual drift, missing affordance with a valid backend, or
